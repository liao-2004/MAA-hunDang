name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（递归拉子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare MaaFramework native libs
        working-directory: Android/MaaFwApp
        run: python scripts/setup_maa_framework.py --abi arm64-v8a

      - name: Write profile config
        run: |
          echo "pi.profile=$GITHUB_WORKSPACE/Android/profile.yaml" > Android/MaaFwApp/local.properties
          echo "build.debugAbi=arm64-v8a" >> Android/MaaFwApp/local.properties

      - name: Build Debug APK
        working-directory: Android/MaaFwApp
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAA-hunDang-debug
          path: Android/MaaFwApp/app/build/outputs/apk/debug/*.apk