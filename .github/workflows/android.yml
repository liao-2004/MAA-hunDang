name: android

# 用 MaaFwApp（MaaFramework 的通用 Android GUI，子模块 Android/MaaFwApp）把 MAA-hunDang 资源打进 APK。
# 参考 MRA 的 .github/workflows/android.yml；本项目不启用 agent、无 logo，
# 故删去了 agent 内核下载、build_agent_bundle 与图标铺入步骤。
#
# 日常 debug：push / PR 自动触发。手动 dispatch 可选 debug/release。
# 打 v* tag 时出 release 包并附到对应 Release。

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "assets/**"
      - "tools/configure.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "assets/**"
      - "tools/configure.py"
  workflow_dispatch:
    inputs:
      assemble:
        description: "debug 或 release（release 需配置 keystore secrets，否则出未签名包）"
        type: choice
        options:
          - debug
          - release
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # MaaFramework native 库版本（MaaFwApp 用 setup_maa_framework.py --tag 铺 .so）。
  # 与 MRA 的 agent 内核 maafw 段对齐；本项目无 agent，可直接指定一个稳定 tag。
  MAAFW_TAG: "v5.14.0"

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi
          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  build:
    needs: meta
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PI_PROFILE: ${{ github.workspace }}/Android/profile.yaml
      # dispatch 按输入；v* tag 出 release；其余 debug
      ASSEMBLE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.assemble) || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}
    steps:
      # MaaCommonAssets（OCR 模型）与 MaaFwApp 都是子模块
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 显式指定 packages，覆盖 action 默认的 "tools platform-tools"。
      # 新版 Android SDK 已移除独立 tools 包，导致默认值里的 tools 找不到而报错。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # OCR 模型（ppocr_v6/small）从 MaaCommonAssets submodule 拷到 assets/resource/model/ocr
      - name: Configure OCR model
        run: |
          python tools/configure.py

      # debug 只 arm64；release 出双 ABI
      - name: Setup MaaFramework native libs
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/setup_maa_framework.py --abi arm64-v8a --tag "$MAAFW_TAG"
          if [ "$ASSEMBLE" = "release" ]; then
            python scripts/setup_maa_framework.py --abi x86_64 --tag "$MAAFW_TAG"
          fi

      - name: Write local.properties
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=${PI_PROFILE}"
            if [ "$ASSEMBLE" != "release" ]; then
              echo "build.debugAbi=arm64-v8a"
            fi
          } > local.properties

      - name: Decode keystore
        if: env.ASSEMBLE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          fi

      - name: Build APK
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$ASSEMBLE" = "release" ]; then
            ./gradlew clean :app:assembleRelease --no-daemon
            variant=release
            arch=universal
          else
            ./gradlew clean :app:assembleDebug --no-daemon
            variant=debug
            arch=arm64-v8a
          fi
          out="${GITHUB_WORKSPACE}/apk-out"
          mkdir -p "$out"
          apk=$(find app/build/outputs/apk/$variant -name "*.apk" | head -n 1)
          cp "$apk" "$out/MAA-hunDang-android-${arch}-MFWAPP-${{ needs.meta.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MAA-hunDang-android-MFWAPP
          path: apk-out
          if-no-files-found: error

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MAA-hunDang-android-MFWAPP
          path: apk-out
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: apk-out/*.apk
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}