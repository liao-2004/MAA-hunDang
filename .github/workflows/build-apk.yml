name: build-apk

# 触发条件：
# - push 时如果改了 Android 子模块指针（gitlink）或本 workflow 文件
# - PR 涉及上述路径
# - 手动触发（Actions 页面点 Run workflow）
# 注意：子模块里的代码改动要推到这个仓库，需要先在父仓库更新子模块指针：
#   git add Android/MaaFwApp && git commit && git push

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "Android/**"
      - "assets/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "Android/**"
      - "assets/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
  # 正式发布时（install.yml 打 tag 创建 Release），把构建出的 APK 一并上传到该 Release
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # 版本号由 git describe 从 tag 推导；浅克隆没有 tag，versionName 会退回提交哈希（如 b6652eb）
          # 必须全量拉取历史与 tag，tag 构建时才能正确显示 v2.x
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission
        run: chmod +x Android/MaaFwApp/gradlew

      # MaaFramework 的 .so 内核不在仓库里，必须先用脚本从 GitHub Release 铺进
      # app/src/main/jniLibs/<abi>/，否则 APK 是空壳（装上加载 native 失败）
      # GITHUB_TOKEN 避免匿名请求触发 API 限流（403 rate limit exceeded）
      - name: Setup MaaFramework native libs
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/setup_maa_framework.py

      # OCR 模型目录 assets/resource/model/ocr/ 被 .gitignore 忽略，CI 全新 checkout 里不存在；
      # 必须先跑 tools/configure.py 从 MaaCommonAssets 子模块（ppocr_v6/small）重建，
      # 否则 syncPiAssets 打出的 pi.zip 缺 OCR 模型，APK 里 OcrDetect 会加载失败
      - name: Configure OCR models
        run: python tools/configure.py

      # MaaFwApp 上游把默认更新源写死为 MirrorChyan，而 MAA-hunDang 没配 mirrorchyan_rid，
      # 不改的话启动自检会报「更新源配置缺失」，得手动在首页切 GitHub 才能用。
      # 这里在全新 checkout 后打一次幂等补丁（tools/patch_maafw_update_source.py），
      # 把默认源与非法值回落都改成 GitHub；子模块指针保持 7e2dc7d 不变
      - name: Patch default update source to GitHub
        run: python tools/patch_maafw_update_source.py

      # 关键：固定 debug 签名，解决「每次更新都得先卸载旧版」。
      # GitHub 托管 runner 每次都是全新机器，AGP 找不到 ~/.android/debug.keystore 时会
      # 就地生成一把随机密钥，于是同版本两次构建的证书都不同（Android 只允许同签名覆盖安装，
      # 签名不一致就报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装）。
      # 这里把仓库固定的一张调试证书还原到 runner 的默认路径，让每次构建都签同一张证书。
      # 密钥存 GitHub Secret（base64），不进仓库；没配时只告警不红，避免 CI 直接断掉。
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 未配置，本次将退回 AGP 随机 debug 签名，产出的 APK 无法覆盖安装旧版"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          # AGP 默认 debug 签名配置认的口径：alias androiddebugkey，口令 android
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey > /dev/null
          echo "已还原固定 debug keystore"

      - name: Build debug APK
        working-directory: Android/MaaFwApp
        env:
          PI_PROFILE: ${{ github.workspace }}/pi-profile.yaml
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 签名没生效的话，用户又要卸载重装，而 CI 照样是绿的 —— 这里把它变成红灯
      - name: Verify APK signature matches the fixed key
        working-directory: Android/MaaFwApp
        env:
          EXPECTED_SHA256: ${{ secrets.ANDROID_DEBUG_KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f' | xargs)
          echo "APK 签名证书 SHA-256: $ACTUAL"
          if [ -z "${EXPECTED_SHA256:-}" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_SHA256 未配置，只打印不校验"
            exit 0
          fi
          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr 'A-F' 'a-f' | xargs)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名与固定密钥不一致（actual=$ACTUAL expected=$EXPECTED），用户会装不上更新"
            exit 1
          fi

      # 正式 release APK 需要先在 app/build.gradle.kts 配置签名（keystore），
      # 配置好后把下面注释打开，并把上传路径改成 release
      # - name: Build release APK
      #   working-directory: Android/MaaFwApp
      #   run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MaaFwApp-debug-apk
          path: Android/MaaFwApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 仅在正式发布时执行，把构建出的 debug APK 作为资产上传到该 Release：
  # - release published（install.yml 打 tag 创建 Release）
  # - v* tag 推送（本 workflow 自己由 tag 触发时）
  upload-apk-to-release:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MaaFwApp-debug-apk
          path: apk

      - name: Rename APK and generate release body
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          APK=$(find apk -name "*.apk" | head -n1 || true)
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          DATE=$(date +%Y%m%d)
          # 文件名里不再带构建日期：这个包不带任何 ABI 标记，应用内更新器按「无标记的
          # 唯一 apk 才算 universal」挑包（MaaFwApp GitHubUpdate.selectAsset 用的是
          # singleOrNull），同一 Release 里出现两个这样的包会判成查不到安装包，
          # 用户就只能手动下载 —— 再撞上签名冲突，就得先卸载。一个 Release 只留一个 apk。
          APK_NAME="MAA-hunDang-debug-${TAG}.apk"
          cp "$APK" "release_assets/${APK_NAME}"
          ls -lh release_assets/

          # 生成与 v2.0.6 手动版本一致的发布说明（下载链接）
          VER="${TAG#v}"
          BODY_DATE=$(date -u +%Y-%m-%d)
          ZIP_NAME="MaaXXX-win-x86_64-${TAG}.zip"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > release_body.md <<EOF
          ## ${VER} (${BODY_DATE})

          ### 性能优化中...

          如果没有特殊需求，请使用以下链接下载：

          手机版: [Android ARM64 (.apk)](https://gh-proxy.com/${BASE}/${APK_NAME})

          PC版: [Windows x86_64 (.zip)](https://gh-proxy.com/${BASE}/${ZIP_NAME})

          ### 注: v5.x.x 版本皆为前瞻版、性能较大
          ###     v1.x.x 版本皆为测试版、不建议下载

          EOF

      # 同一个 tag 可能被多次触发（tag push 与 release published 各来一轮），
      # 先清掉这个 Release 上已有的 apk 资产，避免重跑时留下同名/多份安装包
      - name: Drop stale APK assets from this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -E '^MAA-hunDang-.*\.apk$' | while read -r name; do
              echo "移除旧资产: $name"
              gh release delete-asset "$TAG" "$name" --yes --repo "$GITHUB_REPOSITORY" || true
            done || true

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Update release body with download links
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release edit "$TAG" --notes-file release_body.md --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
